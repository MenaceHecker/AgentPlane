---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.agentplane.io
spec:
  group: agentplane.io
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Agent is a namespaced resource created by a tenant.

          Phase 1 intent: namespaced CRD with a status subresource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentSpec is the desired state of an Agent (requirements
              4.2).
            properties:
              budget:
                description: |-
                  Budget is the Agent's token and request budget. Phase 1 intent: not
                  above its Tenant's budget (FR-POL-2, webhook); the gateway enforces
                  both the agent and the aggregate tenant scope (ADR-004).
                properties:
                  requestsPerMinute:
                    description: |-
                      RequestsPerMinute is the request rate limit (token-bucket refill rate
                      per minute; burst semantics are in ADR-005).
                    format: int32
                    maximum: 2147483647
                    minimum: 0
                    type: integer
                  tokensPerDay:
                    description: TokensPerDay is the daily token cap for the fixed
                      UTC budget window.
                    format: int64
                    minimum: 0
                    type: integer
                required:
                - requestsPerMinute
                - tokensPerDay
                type: object
              image:
                description: |-
                  Image is the agent container image. Phase 1 intent: must come from the
                  approved registry and not use the latest tag (FR-POL-1/3, enforced by
                  admission policy in Phase 3, not by this type).
                type: string
              model:
                description: |-
                  Model is the backend model name the gateway routes to, for example
                  "mock-large".
                type: string
              replicas:
                description: |-
                  Replicas is the desired pod count. Absent means the controller default;
                  an explicit 0 is a real value.
                format: int32
                type: integer
              resources:
                description: Resources are the container resource requests and limits.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              rollout:
                description: Rollout is the progressive delivery configuration.
                properties:
                  slo:
                    description: SLO are the analysis thresholds.
                    properties:
                      errorRate:
                        description: |-
                          ErrorRate is the maximum tolerated error rate in the requirements'
                          format, for example "<1%". Parsing and validation are Phase 5 work.
                        type: string
                      p95LatencyMs:
                        description: P95LatencyMs is the maximum tolerated p95 latency
                          in milliseconds.
                        format: int32
                        type: integer
                    required:
                    - errorRate
                    - p95LatencyMs
                    type: object
                  steps:
                    description: |-
                      Steps are the traffic weights, in percent, a canary passes through, for
                      example [10, 50, 100].
                    items:
                      format: int32
                      type: integer
                    type: array
                  strategy:
                    description: Strategy is the delivery strategy, for example "canary".
                    type: string
                required:
                - slo
                - steps
                - strategy
                type: object
              sandboxClass:
                description: SandboxClass is the isolation class, for example "hardened"
                  (ADR-003).
                type: string
              tools:
                description: |-
                  Tools is the Agent's tool allowlist. Phase 2 intent (FR-GW-6): a tool
                  call is permitted only if the tool is in both this list and the
                  Tenant's egress.allowedTools. Empty or absent allows no tools.
                items:
                  type: string
                type: array
            required:
            - budget
            - image
            - model
            - resources
            type: object
          status:
            description: |-
              AgentStatus is the observed state of an Agent. In Phase 0 nothing writes
              it.
            properties:
              conditions:
                description: |-
                  Conditions use the Condition types defined in this package (Ready,
                  Reconciled, BudgetExhausted, PolicyViolation).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
