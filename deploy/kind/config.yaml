# Local kind topology for AgentPlane (P0-T5): one control plane plus two
# workers that simulate the system and tenant node pools of the placement model
# (requirements section 3.3). Labels and the tenant taint express placement
# INTENT only; kind's default CNI does not enforce NetworkPolicy, so this is not
# tenant isolation (later phases verify isolation separately).
#
# Pins (provenance in docs/local-development.md): kind v0.31.0, and the node
# image below, which is the digest the kind v0.31.0 release notes publish for
# Kubernetes v1.35.0 (multi-arch: amd64 and arm64). Using the digest, not the
# tag, guarantees the image built for that release.
#
# `make kind-up` passes the cluster name explicitly (--name); the cluster is
# never created without it. Nothing here selects a kubeconfig or a context.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      agentplane.io/pool: system
  - role: worker
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    labels:
      agentplane.io/pool: tenant
    kubeadmConfigPatches:
      # Versioned patch (kubeadm v1beta3 is what kind v0.31.0 uses for
      # Kubernetes 1.35). A future kind that adopts v1beta4 needs a second,
      # v1beta4 patch; see the kind v0.31.0 release notes.
      - |
        kind: JoinConfiguration
        apiVersion: kubeadm.k8s.io/v1beta3
        nodeRegistration:
          taints:
            - key: agentplane.io/pool
              value: tenant
              effect: NoSchedule
