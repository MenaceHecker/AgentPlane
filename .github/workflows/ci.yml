name: ci

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, no secrets, no provider calls. No pull_request_target.
permissions:
  contents: read

env:
  PRE_COMMIT_VERSION: "4.7.0"
  GITLEAKS_VERSION: "8.30.1"
  GOLANGCI_LINT_VERSION: "2.15.0"
  # Trivy 0.76.2 (published 2026-11-05, immutable release). Not named TRIVY_*:
  # Trivy reads TRIVY_* variables as flags. The sha256 is for the Linux-64bit
  # tarball and was copied from the release's checksums file.
  IMAGE_SCANNER_VERSION: "0.76.2"
  IMAGE_SCANNER_LINUX_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pre-commit
        run: pip install "pre-commit==${PRE_COMMIT_VERSION}"
      - name: Validate pre-commit config
        run: pre-commit validate-config
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: false
      - name: Install golangci-lint
        if: ${{ hashFiles('go.mod') != '' }}
        run: |
          set -euo pipefail
          base="https://github.com/golangci/golangci-lint/releases/download/v${GOLANGCI_LINT_VERSION}"
          file="golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt"
          grep " ${file}\$" "golangci-lint-${GOLANGCI_LINT_VERSION}-checksums.txt" | sha256sum -c -
          tar -xzf "${file}" --strip-components=1 -C "${RUNNER_TEMP}" "golangci-lint-${GOLANGCI_LINT_VERSION}-linux-amd64/golangci-lint"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      # Runs YAML/merge-conflict/private-key checks, actionlint (workflow
      # syntax), make fmt-check and make lint. The secrets hook runs in the
      # gitleaks job, which also scans full history.
      - name: Hooks (config, workflow syntax, fmt-check, lint)
        run: SKIP=secrets pre-commit run --all-files --show-diff-on-failure

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: false
      # Prints "NOT APPLICABLE: Go module not introduced (P0-T3)" until go.mod exists.
      - name: make test
        run: make test
      # Unit tests of the owned-child supervision library (ADR-007): sole-waiter
      # ownership, replacement identities with a fake adapter, real-child lifecycles.
      - name: make supervisor-test
        run: make supervisor-test
      # Tests the owned-child helper the smoke harness relies on: bounded
      # termination, escalation for a TERM-ignoring child, partial-start and
      # signal cleanup, and that unrelated processes survive.
      - name: make smoke-cleanup-test
        run: make smoke-cleanup-test
      # Make variables must reach the scripts as data: quotes, substitutions and
      # metacharacters in a value execute nothing (logging stubs, no real tools).
      - name: make make-args-test
        run: make make-args-test
      # Kind topology, node-shape checks and cluster targeting, with stub tools:
      # no Docker, no cluster and no network.
      - name: make kind-config-test
        run: make kind-config-test
      # Starts a disposable mock model on a loopback port and checks it
      # end to end (determinism, streaming, validation, failures, shutdown).
      - name: make mock-smoke
        run: make mock-smoke

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # OpenAPI, JSON Schema, canonical-byte and signature checks plus the
      # independent Python reference. Standard library only; no extra installs.
      - name: make contracts-check
        run: make contracts-check

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${file}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "${file}" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      - name: Scan full git history
        run: gitleaks git --redact --no-banner --log-opts="--all" .
      - name: Scan tracked working tree
        run: make secrets
      # gitleaks' built-in config skips go.sum in path-aware scans, so go.sum
      # is scanned separately: its history here and its working tree above.
      - name: Scan go.sum history
        run: make secrets-history
      - name: Secret scanner regression tests
        run: make secrets-selftest

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # Tests of the scan gate itself: fixture reports and stub tools, no network.
      - name: make image-scan-test
        run: make image-scan-test
      # Local build only: nothing is pushed and no registry credentials exist.
      - name: make mock-image
        run: make mock-image
      - name: Container starts, refuses bad flags and runs hardened
        run: |
          set -uo pipefail
          status=0
          docker run --rm agentplane/mockmodel:p0 --error-rate=2 || status=$?
          [ "$status" -eq 2 ] || { echo "want exit 2 for an invalid flag, got $status"; exit 1; }
          docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges agentplane/mockmodel:p0 --help >/dev/null
          user="$(docker image inspect --format '{{.Config.User}}' agentplane/mockmodel:p0)"
          [ "$user" = "65532:65532" ] || { echo "image user is '$user', want 65532:65532"; exit 1; }
      - name: Install Trivy (checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${IMAGE_SCANNER_VERSION}"
          file="trivy_${IMAGE_SCANNER_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/trivy_${IMAGE_SCANNER_VERSION}_checksums.txt"
          grep " ${file}\$" "trivy_${IMAGE_SCANNER_VERSION}_checksums.txt" | sha256sum -c -
          echo "${IMAGE_SCANNER_LINUX_SHA256}  ${file}" | sha256sum -c -
          tar -xzf "${file}" -C "${RUNNER_TEMP}" trivy
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
      # Fails on fixable HIGH/CRITICAL findings and on any scan or database
      # failure; unfixed and lower-severity findings are printed, not hidden.
      - name: make mock-image-scan
        run: make mock-image-scan
